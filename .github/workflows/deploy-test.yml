name: Deploy isolated PLANEA TEST from Semblanzia

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full verified 40-character SHA from Poncmanu/semblanzia test/current"
        required: true
        default: "e244138371c750dc798fe11febff7a22fe67d349"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: planea-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated TEST publishing repository
        uses: actions/checkout@v4

      - name: Validate pinned TEST source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "INVALID_SOURCE_SHA"; exit 1; }

      - name: Require explicitly scoped private source credential
        env:
          SOURCE_TOKEN: ${{ secrets.SEMBLANZIA_SOURCE_READ_TOKEN }}
        run: |
          test -n "$SOURCE_TOKEN" || { echo 'TEST_SOURCE_READ_TOKEN_MISSING'; exit 1; }

      - name: Checkout Semblanzia source (read-only)
        uses: actions/checkout@v4
        with:
          repository: Poncmanu/semblanzia
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: true
          token: ${{ secrets.SEMBLANZIA_SOURCE_READ_TOKEN }}
          # This must be a fine-grained read-only token scoped only to Poncmanu/semblanzia.

      - name: Verify exact source and TEST safety
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source fetch --depth=1 origin test/current
          test "$(git -C source rev-parse FETCH_HEAD)" = "$SOURCE_SHA" || { echo "SOURCE_NOT_CURRENT_TEST_HEAD"; exit 1; }
          grep -q 'https://vylrliliaojtcrrhvscv.supabase.co' source/test/planea/planea.js
          grep -q 'planea_operator_research_status_test' source/test/planea/planea.js
          if grep -R -l 'uiqgqjynrxerqszmyxyj' source/test/planea/*.js source/test/config.js; then
            echo "PROD_SUPABASE_REFERENCE"; exit 1
          fi

      - name: Publish whitelisted static TEST assets without overwriting executor tools
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p test/planea test/account test/assets/brand/wordmark test/assets/brand/favicon test/assets/brand/symbol
          for file in operations.html planea.js planea.css planea-operator-theme.css bridge-client.js contact-enrichment.js candidate-correlation.js provider-notification-consent.js; do
            test -f "source/test/planea/$file"
            cp "source/test/planea/$file" "test/planea/$file"
          done
          # Isolated operator Google login requires the account route.
          for file in index.html account.js account.css; do
            test -f "source/test/account/$file"
            cp "source/test/account/$file" "test/account/$file"
          done
          cp source/test/assets/brand/favicon/semblanzia-favicon-dark.png test/assets/brand/favicon/
          cp source/test/assets/brand/symbol/semblanzia-symbol-master.png test/assets/brand/symbol/
          # Never copy private event configuration or the complete asset library.
          cp source/test/assets/brand/wordmark/semblanzia-wordmark-light.png test/assets/brand/wordmark/
          # Generate only the two public client constants; never publish event details.
          python3 - <<'PYCONFIG'
          import json, re
          from pathlib import Path
          source = Path('source/test/config.js').read_text()
          values = {}
          for name in ('SUPABASE_URL', 'SUPABASE_ANON_KEY'):
              match = re.search(r'^const\s+' + name + r'\s*=\s*([^;]+);', source, re.M)
              if not match:
                  raise SystemExit('MISSING_TEST_PUBLIC_CONFIG: ' + name)
              values[name] = json.loads(match.group(1).strip())
          if values['SUPABASE_URL'] != 'https://vylrliliaojtcrrhvscv.supabase.co':
              raise SystemExit('INCORRECT_TEST_PROJECT')
          if not values['SUPABASE_ANON_KEY'].startswith('sb_publishable_'):
              raise SystemExit('INVALID_PUBLIC_KEY_TYPE')
          Path('test/config.js').write_text(''.join('const '+name+' = '+json.dumps(values[name])+';\n' for name in values))
          PYCONFIG
          # Keep legacy executor-specific files and offline vendor dependencies intact.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sha=os.environ["SOURCE_SHA"]
          manifest={"environment":"TEST","source_repository":"Poncmanu/semblanzia","source_sha":sha,
                    "source_branch":"test/current","publisher":"Poncmanu/semblanzia-executor-test"}
          Path("test-build.json").write_text(json.dumps(manifest,indent=2)+"\n")
          p=Path("deployment.json")
          old=json.loads(p.read_text()) if p.exists() else {}
          old.update({"source_repository":"Poncmanu/semblanzia","source_branch":"test/current",
                      "source_sha":sha,"deployment_strategy":"isolated_github_pages"})
          p.write_text(json.dumps(old,indent=2)+"\n")
          PY
          grep -q 'planea_operator_research_status_test' test/planea/planea.js
          # Source SHA is pinned to test/current above. Fail closed if it still
          # contains the obsolete shared-queue verifier or lacks exact-job checks.
          grep -Fq 'async function verifyExactSupplierSource(jobId,requestId)' test/planea/planea.js
          grep -Fq 'body:{job_id:jobId,request_id:requestId}' test/planea/planea.js
          grep -Fq 'Number(data.processed)!==1' test/planea/planea.js
          if grep -Fq 'verifyQueuedSupplierSources' test/planea/planea.js; then
            echo 'OBSOLETE_SHARED_QUEUE_INVOCATION'; exit 1
          fi
          # Accept either the previously pinned source asset marker or the
          # isolated TEST exact-job cache marker; never use a marker as security proof.
          if ! grep -Fq 'r=20261102-pr101-research-status' test/planea/operations.html &&
             ! grep -Fq '20261103-exact-verifier-v6' test/planea/operations.html; then
            echo 'UNRECOGNIZED_TEST_OPERATOR_ASSET'; exit 1
          fi
          test -f test/planea/executor-controller-test.html
          if grep -R -l 'uiqgqjynrxerqszmyxyj' test/planea/*.js test/config.js; then
            echo "PROD_SUPABASE_REFERENCE"; exit 1
          fi

      - name: Commit isolated TEST deployment only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/account/index.html test/account/account.js test/account/account.css test/assets/brand/favicon/semblanzia-favicon-dark.png test/assets/brand/symbol/semblanzia-symbol-master.png test/planea/operations.html test/planea/planea.js test/planea/planea.css test/planea/planea-operator-theme.css test/planea/bridge-client.js test/planea/contact-enrichment.js test/planea/candidate-correlation.js test/planea/provider-notification-consent.js test/assets/brand/wordmark/semblanzia-wordmark-light.png test/config.js test-build.json deployment.json
          if git diff --cached --quiet; then
            echo "TEST files already match source"
            exit 0
          fi
          git commit -m "deploy(TEST): pinned PLANEA source ${{ inputs.source_sha }}"
          git push

      - name: Stage public tracked files only
        run: |
          set -euo pipefail
          mkdir -p pages-public
          # NEVER upload the private source/ checkout or workflow workspace.
          git archive HEAD | tar -x -C pages-public
          test -f pages-public/test/planea/operations.html
          test -f pages-public/test-build.json
          test ! -e pages-public/source
          test ! -e pages-public/.git

      - name: Prepare GitHub Pages artifact from public files
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-public

  publish-pages:
    name: Publish isolated TEST site to GitHub Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static TEST artifact
        id: deployment
        uses: actions/deploy-pages@v4
